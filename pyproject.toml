[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resonancedb"
version = "0.1.0"
description = "Open tools for recording, validating, and classifying vibration fingerprints of materials"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tar Akiga" }]
requires-python = ">=3.10"
keywords = ["vibration", "resonance", "material-classification", "signal-processing", "open-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "joblib",
]

[project.optional-dependencies]
# ONNX model export + verification (`resdb export`)
export = ["skl2onnx", "onnx", "onnxruntime"]
# Confusion-matrix image in `resdb evaluate`
plots = ["matplotlib"]
# Legacy phone CSV converter (scripts/phyphox_to_resonancedb.py)
phone = ["pandas"]
# Decode non-WAV recordings (mp4, m4a, mp3, ...) in `resdb ingest`
media = ["imageio-ffmpeg"]
dev = ["pytest", "pandas", "matplotlib", "imageio-ffmpeg"]

[project.scripts]
resdb = "resonancedb.cli:main"

[project.urls]
Homepage = "https://github.com/AiqraAI/resonancedb"
Issues = "https://github.com/AiqraAI/resonancedb/issues"

[tool.setuptools]
packages = ["resonancedb"]
